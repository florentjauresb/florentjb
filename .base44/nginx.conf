# Full nginx config (mounted at /etc/nginx/nginx.conf) for the Base44 sandbox.
#
# Why a full config instead of a conf.d snippet: the sandbox clones the repo with
# a root-only (0700) working directory, so nginx's default `user nginx;` worker
# cannot read the bind-mounted source and every request returns 403. Running the
# workers as root inside this throwaway dev container fixes that without changing
# the repository permissions.
user root;

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Always revalidate so the sandbox preview reflects the current source.
        add_header Cache-Control "no-store" always;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
